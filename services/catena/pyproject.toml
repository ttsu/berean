[project]
name = "catena"
version = "0.1.0"
description = "Berean retrieval and citation service — the model layer"
requires-python = ">=3.12"
license = "Apache-2.0"
# Only what the current task needs. The embedder (Task 5) and the acquisition
# pipeline (Task 4) each add their own; a dependency added before its task is a
# dependency nobody can justify at review.
#
# These two are Task 2's: the generated stubs in `gen/` import `google.protobuf`
# and `grpc`, so a contract that cannot be imported is not a contract that has
# been delivered. Exact versions are pinned in uv.lock. The floors below are the
# runtime versions the pinned codegen plugins in buf.gen.yaml emit against —
# protobuf's generated code checks its runtime version at import.
dependencies = [
    "protobuf>=6.33.1,<7",
    "grpcio>=1.76.0,<2",
    # Task 4's one dependency. `corpora/<corpus-id>/manifest.yaml` is a
    # committed, hand-reviewed provenance record, and YAML is what the
    # acquisition contract specifies it in. Fetch is stdlib `urllib` and HTML
    # extraction is stdlib `html.parser`, so the offline overlay stays honest
    # and no acquisition pulls a parser at run time.
    "pyyaml>=6.0.2,<7",
    # The BCO's only source is a 423-page PDF: pcaac.org serves the text
    # through a JavaScript application (230 KB of markup over 0.5% text), and
    # no bare-text edition exists. Extraction was stdlib until here --
    # `html.parser` and `zipfile` -- and there is no stdlib route to a PDF, so
    # this is the one corpus that costs a parser. pypdf is BSD-3-Clause, pure
    # Python, and has no runtime dependencies of its own, so the offline
    # overlay stays honest and `docker compose up` still needs no account.
    "pypdf>=6.0,<7",
    # Task 5's two. Ingestion is the first thing in this project that writes the
    # corpus tables and the first that runs a model, so it is the first that
    # needs a driver or an encoder.
    #
    # psycopg 3 is the Postgres driver. LGPL-3.0, which permits the commercial
    # downstream use CLAUDE.md tells us to assume: it is a library used through
    # its published interface, not linked-and-modified, so it places no term on
    # this project's Apache-2.0 licence. `[binary]` ships the wheels, so the
    # image needs no libpq build step.
    "psycopg[binary]>=3.2,<4",
    # BGE-M3 runs in-process from /models/ rather than through Ollama, whose
    # `bge-m3` exposes dense vectors only and drops the learned sparse
    # representation the model was chosen for (ADR-0006, TECHNICAL-SPEC).
    # sentence-transformers is Apache-2.0 and reads the weights layout the
    # pinned download already has -- modules.json, 1_Pooling,
    # sentence_bert_config.json -- so `max_seq_length` comes from the model
    # rather than from a constant this repository would have to keep true.
    "sentence-transformers>=3.0,<6",
]

[project.scripts]
catena = "catena.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catena"]

[tool.ruff]
line-length = 100
