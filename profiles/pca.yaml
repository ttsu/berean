# Presbyterian Church in America.
#
# What this file records is a doctrinal commitment, not configuration: which
# corpora are in scope and what stance the tradition takes toward each. Go
# loads it, validates it against what is actually ingested, and resolves it
# into the filter sent to Catena. The document itself never crosses the
# boundary (ADR-0015).
#
# Every ID is edition-specific. `wcf` is a bug; the PCA holds the 1788 American
# revision, which differs from the 1646 original on the civil magistrate.

profile: pca

# Scripture is not a parallel channel. It is appended to the corpora list below
# at this stance, and a verse citation is verified by the same four checks as a
# confessional one. `binding` is the default and the PCA takes it (ADR-0011).
scripture:
  corpus_id: web-2020
  stance: binding

corpora:
  - id: wcf-1788-american
    stance: binding
    note: American revision; ch. 23 revised on the civil magistrate

  - id: wlc-1788-american
    stance: binding

  - id: wsc-1788-american
    stance: binding

  - id: pca-bco-2026
    stance: governing
    note: Church order — binds procedure, not doctrine

  - id: wcf-1646-epcew-modernised
    stance: contrary
    label: "1646 Westminster in modern English, not the PCA's text"

  - id: pca-ga28-2000-creation-study
    stance: advisory
    note: GA study committee reports are advice to the courts, not constitutional

  - id: calvin-institutes-1559-beveridge
    stance: advisory
    note: 1559 edition, Beveridge 1845 translation; respected, not constitutional

# A locus this tradition holds open, and a pointer to the document that
# establishes it. A pointer, never prose: Python resolves it through ordinary
# retrieval and grounds `state_of_debate` in what it reads there.
contested:
  - locus: creation-days
    ruling_source:
      corpus_id: pca-ga28-2000-creation-study
      # Rec.2 is the ruling — the Assembly affirming that a diversity of views
      # on the creation days is acceptable. The report's expository body argues
      # four views the denomination did not adopt, and tier is per corpus
      # rather than per chunk, so pointing at the body would cite advocacy as
      # though it were the finding.
      locator: "GA28 Rec.2"

# No `excluded` entry, deliberately. Populating it means acquiring the PCA's
# 2007 Federal Vision report, whose copyright status is unchecked, and Phase 1
# does not widen for it. Phase 2 obligation — see TECHNICAL-SPEC.
