// The one call.
//
// Go is the trust boundary; Python is the model layer. There is exactly one
// gRPC call from Go into Python per generation attempt — once per turn, plus at
// most one regeneration when verification fails (ADR-0002, ADR-0010). A turn
// therefore makes at most two calls, and only ever two. Any other call means
// the seam is in the wrong place.

syntax = "proto3";

package berean.v1;

import "berean/v1/answer.proto";
import "berean/v1/filter.proto";
import "berean/v1/trace.proto";
import "berean/v1/verification.proto";

option go_package = "github.com/ttsu/berean/gen/berean/v1;bereanv1";

// CatenaService is the whole of what Go asks Python to do.
service CatenaService {
  // Unary. One invocation per generation attempt.
  rpc Answer(AnswerRequest) returns (AnswerResponse);
}

message AnswerRequest {
  // The user's question, verbatim.
  string query = 1;

  // Empty in Phase 1. Present so Phase 4's conversation memory is an addition
  // rather than a break — a bare string would have had to be replaced.
  repeated ConversationTurn conversation_context = 2;

  // The resolved filter. Never the profile.
  FilterSpec filter_spec = 3;

  // The loci this tradition holds open, each with a pointer to its ruling.
  // A sibling of `filter_spec`, not part of it (ADR-0015).
  repeated ContestedLocus contested_loci = 4;

  // Correlates the trace, the response, and the Langfuse span.
  string request_id = 5;

  // Empty on the first attempt. On a regeneration, exactly what failed and why.
  // ADR-0010 decided the retry carries the failure reasons back and nothing
  // carried them; this reuses the message Go already produces and persists, so
  // Go emits only what it actually found and composes no prose.
  repeated VerificationResult previous_failures = 6;

  // The answer-level rules the previous attempt broke, alongside
  // `previous_failures`. Empty on the first attempt.
  //
  // A separate field rather than more `VerificationResult`s, because several
  // of the rules Go enforces are about a slot rather than a citation and one
  // of them — the omission check — fires on an answer whose every citation
  // passed all four checks. Folding those into `VerificationResult` would
  // mean emitting a result whose four booleans all say "passed" beside a
  // detail saying the answer failed (ADR-0024).
  repeated AnswerFailure answer_failures = 8;

  // 1 on the first call, 2 on the regeneration. Nothing else is valid.
  //
  // Required for metrics rather than for generation: first-attempt and
  // post-retry verification must be distinguishable, or a regeneration hides a
  // rising fabrication rate (ADR-0010).
  int32 attempt = 7;
}

// ConversationTurn is a prior turn of the conversation.
//
// Deliberately empty. Phase 4 decides what a turn carries; what is fixed now is
// only that context is a list of turns, so Phase 4 adds fields rather than
// changing a field's type.
message ConversationTurn {}

message AnswerResponse {
  // Exactly one. A response carrying both is not a state this system has a
  // meaning for, and one carrying neither is a turn that did not happen.
  oneof outcome {
    AnswerObject answer = 1;
    GenerationFailure generation_failure = 3;
  }

  // Always present, on both branches. The trace is the evidence of the
  // retrieval that happened, and a failed generation performed one — losing it
  // is the defect this channel exists to fix.
  RetrievalTrace trace = 2;
}

// Why no answer object was produced. The upstream sibling of `AnswerFailure`:
// that one names the slot a rule broke in, and a generation with no object has
// no slots (ADR-0024, ADR-0025).
message GenerationFailure {
  GenerationFailureCode code = 1;

  // What happened, factually. Never the model's account of its own reasoning:
  // for a refusal this is the provider's category and never its explanation,
  // which is exactly the introspection CLAUDE.md constraint 5 forbids and
  // exactly the kind of field it would enter through.
  string detail = 2;

  // How far the attempt got before it failed. Zero when it produced nothing.
  int32 completion_tokens = 3;
}

enum GenerationFailureCode {
  GENERATION_FAILURE_CODE_UNSPECIFIED = 0;
  // The completion hit the token ceiling. Measured as deterministic on the
  // Phase 1 default; raising the ceiling converts it into a timeout and buys
  // nothing (see generate.py, and ACCEPTANCE.md).
  GENERATION_FAILURE_CODE_TRUNCATED = 1;
  // The model ran out of context window rather than out of ceiling.
  GENERATION_FAILURE_CODE_CONTEXT_EXHAUSTED = 2;
  // The content did not parse as JSON.
  GENERATION_FAILURE_CODE_NOT_JSON = 3;
  // It parsed to a JSON value that is not an object.
  GENERATION_FAILURE_CODE_NOT_AN_OBJECT = 4;
  // No choices in the response at all. Empty content in a choice that exists
  // produces NOT_JSON instead, because `json.loads("")` raises.
  GENERATION_FAILURE_CODE_EMPTY = 5;
  // The provider declined the request on policy grounds. The category is
  // recorded in `detail`; the explanation is never read.
  GENERATION_FAILURE_CODE_PROVIDER_REFUSED = 6;
}
