# `docker compose up` must give a working system with no external accounts.
# That is the project's acceptance test (SHARED §1) — if a change breaks it,
# the change is wrong.
#
# It does not, on its own, give a working system: neither model weights nor
# corpus text ship in this repository (ADR-0014), so run `make provision`
# first. See README.

name: berean

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  # Reuses the MinIO SHARED §1 already requires, rather than a second object
  # store just for observability (SHARED §6).
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  # Presigned media URLs are opened by the browser, which cannot resolve
  # `minio`. The internal endpoint is what the server itself uses.
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
  # No phoning home. Steady-state operation requires no egress (SHARED §1).
  TELEMETRY_ENABLED: "false"
  LANGFUSE_UPDATE_CHECK_ENABLED: "false"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BEREAN_DB_OWNER_PASSWORD: ${BEREAN_DB_OWNER_PASSWORD}
      BEREAN_DB_CATENA_PASSWORD: ${BEREAN_DB_CATENA_PASSWORD}
      BEREAN_DB_GATEWAY_PASSWORD: ${BEREAN_DB_GATEWAY_PASSWORD}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory. `make reset` is what re-runs it.
      - ./compose/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user clickhouse --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot. Creates the bucket Langfuse expects, so first boot needs no human.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/langfuse
        mc mb --ignore-existing local/berean
    restart: "no"

  langfuse-worker:
    image: langfuse/langfuse-worker:4.27.0
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment: *langfuse-env

  langfuse-web:
    image: langfuse/langfuse:4.27.0
    depends_on:
      langfuse-worker: { condition: service_started }
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # The headless bootstrap. Without these, first boot presents a signup
      # form, and a stack that asks a human to create an account fails the
      # no-external-accounts test as surely as a hosted service would
      # (SHARED §6, ADR-0009 status note).
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    ports:
      - "${LANGFUSE_PORT}:3000"
    healthcheck:
      # Langfuse 4's Next server binds the container's own IP rather than
      # 0.0.0.0, so `localhost` inside the container is refused. Probe the
      # address it actually listens on.
      test: ["CMD-SHELL", "wget -q -O- http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ollama:
    image: ollama/ollama:0.33.2
    volumes:
      # `make provision` pulls the pinned tag here. Weights are never baked into
      # an image and never fetched on first query (SHARED §1).
      - ./models/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Python. The model layer. Empty in Task 1, so it is behind a profile and
  # excluded from the default `up` — a container that exits with "not
  # implemented" on every start makes a green acceptance test look red. It
  # still builds, so it cannot rot. Task 7 gives it a server and drops the
  # profile.
  catena:
    profiles: [services]
    build:
      context: .
      dockerfile: services/catena/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_healthy }
    # Everything this container writes lands in a bind mount, so it runs as the
    # invoking user rather than as the image's uid — otherwise ./data and
    # ./corpora come back owned by 1001 and the host user cannot write into
    # what it just acquired. The Makefile supplies these; the defaults cover a bare
    # `docker compose run`. HOME travels with the override, because Docker
    # resolves no home directory for a uid absent from the image's passwd.
    user: "${BEREAN_UID:-1000}:${BEREAN_GID:-1000}"
    environment:
      HOME: /tmp
      CATENA_DATABASE_URL: postgresql://catena:${BEREAN_DB_CATENA_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CATENA_OLLAMA_URL: http://ollama:11434
      CATENA_MODELS_DIR: /models
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
    volumes:
      - ./models:/models:ro
      - ./data:/data
      # Writable: `catena acquire --bless` writes manifest.yaml and
      # fingerprints.txt back into corpora/<corpus-id>/ (INTEGRATION-SPEC,
      # "Corpus acquisition contract"). Read-only here would fail the very
      # first acquisition of a corpus, which is the only one that blesses.
      - ./corpora:/corpora

  # Go. The trust boundary. A CLI, not a server, so it is never part of `up`
  # even once it works — it is run with `docker compose run --rm gateway`,
  # which is also how Task 11 runs acceptance under the egress-blocked overlay.
  gateway:
    profiles: [services]
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      catena: { condition: service_started }
    environment:
      BEREAN_DATABASE_URL: postgresql://gateway:${BEREAN_DB_GATEWAY_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BEREAN_CATENA_ADDR: catena:50051
      BEREAN_SERVE_LOCAL_ONLY: ${BEREAN_SERVE_LOCAL_ONLY}
      BEREAN_TOP_K: ${BEREAN_TOP_K}
      LANGFUSE_HOST: http://langfuse-web:3000

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  minio-data:
