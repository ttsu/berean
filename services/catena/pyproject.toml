[project]
name = "catena"
version = "0.1.0"
description = "Berean retrieval and citation service — the model layer"
requires-python = ">=3.12"
license = "Apache-2.0"
# Deliberately empty. Task 1 builds the skeleton; the embedder (Task 5),
# the gRPC server (Task 7), and the acquisition pipeline (Task 4) each add
# what they actually need. A dependency added before its task is a dependency
# nobody can justify at review.
dependencies = []

[project.scripts]
catena = "catena.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catena"]

[tool.ruff]
line-length = 100
